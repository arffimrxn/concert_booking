<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Concert Booking</title>
    <style>
        /* Global Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; /* Matches your theme */
            color: #2d3748;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* The Welcome Card */
        .welcome-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Typography */
        h1 {
            margin-top: 0;
            font-size: 2.8em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1em;
            color: #718096;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* The Fun Button */
        .continue-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .continue-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>You're In! 🎉</h1>
        <p>Welcome to the ultimate concert experience, <strong>{{ user.username }}</strong>. We've got some amazing shows lined up for you. Grab your tickets before they sell out!</p>
        
        <a href="{% url 'concert_list' %}" class="continue-btn">See Upcoming Shows</a>
    </div>

</body>
</html>
